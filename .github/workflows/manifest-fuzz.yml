name: Manifest Fuzz Gate

on:
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manifest-fuzz-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  manifest-fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out exact requested commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Verify exact checked-out commit
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Run complete deterministic manifest fuzz gate
        shell: bash
        run: python3 benchmarks/fuzz/manifest_fuzz.py --cases 10000 --seed 20260727 --output artifacts/fuzz/manifest

      - name: Upload raw manifest fuzz evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: manifest-fuzz-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/fuzz/manifest
          if-no-files-found: error
          retention-days: 14
