name: Grimoire CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  release-evidence:
    name: private release evidence
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out exact requested commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Build exact release inputs
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python scripts/grimoire.py check \
            --json-output artifacts/release-inputs/grimoire-check.json
          python checks/ci_policy_check.py \
            --json-output artifacts/release-inputs/ci-policy.json \
            --expected-sha "$EXPECTED_SHA"
          python scripts/benchmark_runner.py run \
            --suite benchmarks/suites/runner-smoke.json \
            --output artifacts/release-inputs/benchmark \
            --commit "$EXPECTED_SHA"

      - name: Generate and verify private evidence
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python scripts/release_evidence.py generate \
            --artifact artifacts/release-inputs/grimoire-check.json \
            --artifact artifacts/release-inputs/ci-policy.json \
            --benchmark \
              artifacts/release-inputs/benchmark/BENCHMARK_RESULTS.json \
            --expected-sha "$EXPECTED_SHA" \
            --output artifacts/release/evidence.json
          python scripts/release_evidence.py verify \
            --evidence artifacts/release/evidence.json \
            --expected-sha "$EXPECTED_SHA"
          python scripts/release_evidence.py rollback-dry-run \
            --evidence artifacts/release/evidence.json \
            --expected-sha "$EXPECTED_SHA"

      - name: Upload private release evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            artifacts/release-inputs
            artifacts/release
          if-no-files-found: error
          retention-days: 14

  ci-policy:
    name: non-cyber CI policy
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out exact requested commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Validate CI policy and dependency boundary
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python checks/ci_policy_check.py \
            --json-output artifacts/ci-policy/result.json \
            --expected-sha "$EXPECTED_SHA"

      - name: Upload CI policy evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-policy-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/ci-policy
          if-no-files-found: error
          retention-days: 14

  runtime-matrix:
    name: runtime (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out exact requested commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up matrix Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python }}

      - name: Record exact environment
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python scripts/write_ci_environment.py \
            --output artifacts/matrix/environment.json \
            --expected-sha "$EXPECTED_SHA"

      - name: Run strict manifest compatibility
        run: |
          python benchmarks/manifest_validation/strict_500.py \
            --cases 500 \
            --seed 20260727 \
            --output artifacts/matrix/strict-500.json

      - name: Run deterministic fuzz subset
        run: |
          python benchmarks/fuzz/manifest_fuzz.py \
            --cases 200 \
            --seed 20260727 \
            --output artifacts/matrix/fuzz

      - name: Run dependency-free Grimoire check
        run: |
          python scripts/grimoire.py check \
            --json-output artifacts/matrix/grimoire-check.json

      - name: Upload matrix environment and results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: matrix-environment-${{ matrix.os }}-py${{ matrix.python }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/matrix
          if-no-files-found: error
          retention-days: 14

  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install CI-only schema validator
        shell: bash
        run: |
          python3 -m pip install --require-hashes \
            --isolated \
            --no-deps \
            --no-input \
            --disable-pip-version-check \
            --only-binary=:all: \
            -r requirements/ci-schema.txt

      - name: Validate Draft 2020-12 schemas
        shell: bash
        run: python3 checks/json_schema_check.py

      - name: Run strict 500-case manifest acceptance
        shell: bash
        run: python3 benchmarks/manifest_validation/strict_500.py --cases 500 --seed 20260727 --output artifacts/manifest-validation/strict-500.json

      - name: Run fast manifest fuzz subset
        shell: bash
        run: python3 benchmarks/fuzz/manifest_fuzz.py --cases 1000 --seed 20260727 --output artifacts/fuzz/fast

      - name: Run Grimoire conformance checks
        id: conformance
        shell: bash
        run: |
          mkdir -p artifacts
          set +e
          python3 scripts/grimoire.py check \
            --json-output artifacts/grimoire-check.json
          status=$?
          set -e
          cat artifacts/grimoire-check.json
          exit "$status"

      - name: Upload Grimoire evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: grimoire-evidence
          path: |
            artifacts/grimoire-check.json
            artifacts/manifest-validation/strict-500.json
            artifacts/fuzz/fast
          if-no-files-found: error
          retention-days: 14
