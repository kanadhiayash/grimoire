name: Release Candidate Reproduction

on:
  pull_request:
    paths:
      - "benchmarks/release-candidate/**"
      - "src/grimoire/benchmarks/release_candidate.py"
      - "tests/test_release_candidate_benchmark.py"
      - ".github/workflows/release-candidate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    name: clean reproduction (${{ matrix.run-id }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        run-id: [run-1, run-2, run-3]

    steps:
      - name: Check out exact candidate commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up supported Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Confirm exact clean source
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Run complete release-candidate suite
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RUN_ID: ${{ matrix.run-id }}
        run: |
          python3 benchmarks/release-candidate/run.py run \
            --suite benchmarks/release-candidate/suite.json \
            --output "artifacts/release-candidate/$RUN_ID" \
            --expected-commit "$EXPECTED_SHA" \
            --run-id "$RUN_ID"

      - name: Upload complete run package
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate-${{ matrix.run-id }}
          path: artifacts/release-candidate/${{ matrix.run-id }}
          if-no-files-found: error
          retention-days: 30

  compare:
    name: compare three reproductions
    needs: reproduce
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out exact candidate commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up supported Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Download all run packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          pattern: release-candidate-run-*
          path: artifacts/download

      - name: Compare exact-commit results
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 benchmarks/release-candidate/run.py compare \
            --run artifacts/download/release-candidate-run-1 \
            --run artifacts/download/release-candidate-run-2 \
            --run artifacts/download/release-candidate-run-3 \
            --expected-commit "$EXPECTED_SHA" \
            --output artifacts/release-candidate-comparison/comparison.json

      - name: Upload comparison
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate-comparison
          path: artifacts/release-candidate-comparison
          if-no-files-found: error
          retention-days: 30
